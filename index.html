<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sky Merge Defense</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hud">
        <div><span class="label">STAGE</span><strong id="stageName">1-1 蒼空の門</strong></div>
        <div class="currency"><span>✦</span><strong id="mana">0</strong></div>
        <div class="base"><span>拠点</span><div class="bar"><i id="baseBar"></i></div><b id="baseHp">100</b></div>
      </header>
      <section id="battlefield" aria-label="戦場">
        <div class="sky-island island-a"></div><div class="sky-island island-b"></div>
        <div id="enemyLayer"></div><div id="projectileLayer"></div><div id="unitLayer" class="board"></div>
        <div id="tower" class="tower">✦</div>
        <div id="waveNotice" class="wave-notice"></div>
      </section>
      <section class="status-row">
        <span>WAVE <b id="wave">1</b>/<b id="waveMax">8</b></span>
        <span>敵 <b id="enemiesLeft">0</b></span>
        <span>撃破 <b id="kills">0</b></span>
      </section>
      <section class="actions">
        <button id="summonBtn" class="summon"><small>最初の1体は無料</small><strong>召 喚</strong><span id="summonCost">✦ 8</span></button>
        <button id="pauseBtn" class="round">Ⅱ</button>
      </section>
      <p id="hint" class="hint">召喚したユニットをタップして、2体選んで合成しよう！</p>
      <section class="unit-guide" id="unitGuide"></section>
    </main>
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modalCard"></div></div>
    <script src="game.js"></script>
  </body>
</html>
